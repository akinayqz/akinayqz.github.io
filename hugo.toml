baseURL = "https://akinayqz.github.io/"
title = "akinayqz"
theme = "rewired"
locale = "en-US"

[taxonomies]
  tag = "tags"
  category = "categories"

[pagination]
  pagerSize = 10

[params]
  author = "Your name"
  # Photo shown in a terminal window on the home page. Path is relative to assets/; remove to hide it.
  photo = "images/me.jpg"
  photoAlt = "Photo of me"
  descriptionLines = [
    "A short description of your website,",
    "your work, projects, or interests.",
  ]
  tagline = "I write on the [blog](/posts/), share [projects](/projects/), and keep a simple personal website."
  blogPageSize = 5

[params.footer]
  text = 'akinayqz.github.io // made with ♥ and [Hugo](https://gohugo.io/) // theme [rewired](https://github.com/RigleGit/rewired)'
  prompt = "user@akinayqz:~$"

[params.toc]
  enabled = true
  ordered = false
  startLevel = 1
  endLevel = 3

[[params.social]]
  name = "GitHub"
  url = "https://github.com/akinayqz"
  icon = "fa-brands fa-github"

[[params.social]]
  name = "Email"
  url = "mailto:hello@example.org"
  icon = "fa-regular fa-envelope"

[[menus.main]]
  name = "home"
  pageRef = "/"
  weight = 10

[[menus.main]]
  name = "blog"
  pageRef = "/posts"
  weight = 20

[[menus.main]]
  name = "projects"
  pageRef = "/projects"
  weight = 30

[[menus.main]]
  name = "about"
  pageRef = "/about"
  weight = 40

[markup]
  [markup.highlight]
    # Emit CSS classes instead of inline styles so code blocks follow the light/dark toggle (see assets/css/syntax.css)
    noClasses = false
  [markup.goldmark]
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [['\[', '\]'], ['$$', '$$']]
          inline = [['\(', '\)']]
